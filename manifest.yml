applications:
- name: underwriting-service
  memory: 1G
  buildpack: java_buildpack
  path: target/underwriting-service-0.0.1-SNAPSHOT.jar
  routes:
  - route: underwriting-service.apps.internal
  health-check-type: http
  health-check-http-endpoint: /actuator/health
  timeout: 120
  env:
    EUREKA_URL: http://eureka-server.apps.internal:8080/eureka
    JBP_CONFIG_OPEN_JDK_JRE: '{jre: {version: 17.+}}'
