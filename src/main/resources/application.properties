server.port=${PORT:8080}
spring.application.name=underwriting-service
management.endpoints.web.exposure.include=health,info
eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://eureka-server.apps.internal:8080/eureka}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:${spring.application.name}.apps.internal}
eureka.instance.prefer-ip-address=false
eureka.instance.non-secure-port=${server.port}
demo.timezone=America/Chicago
